# 烹饪成就。前 33 个由 tools/migrate_kaleidoscope.py 从烹饪插件自带成就迁移而来（2026-10-26），
# 之后手工维护，不要再运行迁移脚本覆盖。成就 id 上线后不要改名或复用；下架请用 disabled: true。
tab:
