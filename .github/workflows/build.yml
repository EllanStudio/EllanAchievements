name: Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew clean check shadowJar

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EllanAchievements
          path: |
            paper/build/libs/EllanAchievements-*.jar
            config/achievements/*.yml
          if-no-files-found: error
