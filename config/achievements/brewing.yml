# 工业酿酒成就（TheBrewingProject）。"获得"只计自己参与酿造的酒，同一瓶只计一次。
# 成就 id 上线后不要改名或复用；下架请用 disabled: true。
tab:
  id: brewing
  title: "工业酿酒"
  description: "酒香不怕巷子深"
  icon: { item: "minecraft:barrel" }
  background: "minecraft:block/barrel_top"
achievements:
  first_brew:
    title: "初酿"
    description: "获得一瓶自己酿造的酒"
    icon: { item: "minecraft:potion" }
    trigger: brew_obtain
    rewards: { exp: 10 }
  excellent_brew:
    parent: first_brew
    title: "佳酿"
    description: "获得一瓶自己酿造的优秀品质的酒"
    icon: { item: "minecraft:honey_bottle" }
    frame: goal
    trigger: brew_obtain
    filter: { quality: "excellent" }
    rewards: { exp: 50, coins: 300 }
  ten_recipes:
    parent: first_brew
    title: "酒窖主人"
    description: "酿出 10 种不同的酒"
    icon: { item: "minecraft:barrel" }
    frame: goal
    trigger: brew_obtain
    goal: 10
    count: unique
    unique-by: recipe
    rewards: { exp: 50, coins: 500 }
  fifty_drinks:
    parent: first_brew
    title: "千杯不醉"
    description: "喝下 50 瓶酒"
    icon: { item: "minecraft:glass_bottle" }
    trigger: brew_drink
    goal: 50
    rewards: { exp: 30 }
  lychee_wine:
    parent: ten_recipes
    title: "一骑红尘妃子笑"
    description: "酿出荔枝甜酒"
    icon: { item: "customcrops:lychee" }
    trigger: brew_obtain
    filter: { recipe: "lychee_wine" }
    rewards: { exp: 30 }
  durian_spirit:
    parent: ten_recipes
    title: "闻着臭，喝着香"
    description: "酿出榴莲烈酒"
    icon: { item: "customcrops:durian" }
    frame: challenge
    hidden: true
    trigger: brew_obtain
    filter: { recipe: "durian_spirit" }
    rewards: { exp: 100, coins: 500 }

  # —— 产量 ——
  ten_brews:
    parent: first_brew
    title: "小作坊"
    description: "获得 10 瓶自己酿造的酒"
    icon: { item: "minecraft:brewing_stand" }
    trigger: brew_obtain
    goal: 10
    rewards: { exp: 20, coins: 100 }
  hundred_brews:
    parent: ten_brews
    title: "酒厂开张"
    description: "获得 100 瓶自己酿造的酒"
    icon: { item: "minecraft:cauldron" }
    frame: goal
    trigger: brew_obtain
    goal: 100
    rewards: { exp: 80, coins: 500 }
  five_hundred_brews:
    parent: hundred_brews
    title: "流水线"
    description: "获得 500 瓶自己酿造的酒"
    icon: { item: "minecraft:hopper" }
    frame: challenge
    trigger: brew_obtain
    goal: 500
    rewards: { exp: 100, coins: 1000 }

  # —— 品类 ——
  twenty_five_recipes:
    parent: ten_recipes
    title: "酒神"
    description: "酿出 25 种不同的酒"
    icon: { item: "minecraft:dragon_breath" }
    frame: challenge
    trigger: brew_obtain
    goal: 25
    count: unique
    unique-by: recipe
    rewards: { exp: 100, coins: 1000 }
  beer:
    parent: first_brew
    title: "下班来一杯"
    description: "酿出啤酒"
    icon: { item: "minecraft:wheat" }
    trigger: brew_obtain
    filter: { recipe: "beer" }
    rewards: { exp: 20 }
  beer_family:
    parent: beer
    title: "啤酒家族"
    description: "酿出啤酒、黑啤酒、小麦啤酒和酒花艾尔"
    icon: { item: "customcrops:hop" }
    frame: goal
    trigger: brew_obtain
    filter: { recipe: ["beer", "darkbeer", "wheatbeer", "hop_ale"] }
    goal: 4
    count: unique
    unique-by: recipe
    rewards: { exp: 60, coins: 300 }
  whiskey:
    parent: ten_recipes
    title: "橡木桶的耐心"
    description: "酿出纯麦威士忌"
    icon: { item: "minecraft:oak_log" }
    trigger: brew_obtain
    filter: { recipe: "whiskey" }
    rewards: { exp: 30 }
  vodka_trio:
    parent: ten_recipes
    title: "伏特加三兄弟"
    description: "酿出土豆伏特加、金色伏特加和蘑菇伏特加"
    icon: { item: "minecraft:potato" }
    frame: goal
    trigger: brew_obtain
    filter: { recipe: ["vodka", "g_vodka", "shroom_vodka"] }
    goal: 3
    count: unique
    unique-by: recipe
    rewards: { exp: 60, coins: 300 }
  absinthe:
    parent: ten_recipes
    title: "绿色妖精"
    description: "酿出绿色苦艾酒"
    icon: { item: "minecraft:fern" }
    hidden: true
    trigger: brew_obtain
    filter: { recipe: "gr_absinthe" }
    rewards: { exp: 40, coins: 200 }
  spirytus:
    parent: twenty_five_recipes
    title: "生命之水"
    description: "酿出优秀品质的波兰伏特加"
    icon: { item: "minecraft:ghast_tear" }
    frame: challenge
    hidden: true
    trigger: brew_obtain
    filter: { recipe: "spirytus", quality: "excellent" }
    rewards: { exp: 100, coins: 800 }
  coffee:
    parent: first_brew
    title: "续命水"
    description: "做出一杯咖啡"
    icon: { item: "minecraft:cocoa_beans" }
    trigger: brew_obtain
    filter: { recipe: ["coffee", "iced_coffee"] }
    rewards: { exp: 20 }
  orchard_wines:
    parent: ten_recipes
    title: "果园酒坊"
    description: "用本服水果酿出 6 种不同的果酒"
    icon: { item: "customcrops:mango" }
    frame: goal
    trigger: brew_obtain
    filter:
      recipe: ["lychee_wine", "mango_spirit", "coconut_rum", "cherry_liqueur", "berry_cordial",
               "goji_tonic", "durian_spirit", "pitaya_sparkling", "papaya_mead", "avocado_cream",
               "tropical_trio", "virelia_wine"]
    goal: 6
    count: unique
    unique-by: recipe
    rewards: { exp: 80, coins: 500 }
  glowfungus_liquor:
    parent: orchard_wines
    title: "来自下界的菌酿"
    description: "酿出诡光菌酒"
    icon: { item: "customcrops:warped_glow_fungus" }
    hidden: true
    trigger: brew_obtain
    filter: { recipe: "glowfungus_liquor" }
    rewards: { exp: 40, coins: 200 }
  chili_spirit:
    parent: orchard_wines
    title: "一口入魂"
    description: "酿出烈焰辣椒烈酒"
    icon: { item: "customcrops:pepper" }
    trigger: brew_obtain
    filter: { recipe: "chili_spirit" }
    rewards: { exp: 30 }

  # —— 品质 ——
  bad_brew:
    parent: first_brew
    title: "交了学费"
    description: "酿出一瓶劣质的酒"
    icon: { item: "minecraft:rotten_flesh" }
    hidden: true
    trigger: brew_obtain
    filter: { quality: "bad" }
    rewards: { exp: 10 }
  ten_excellent:
    parent: excellent_brew
    title: "精益求精"
    description: "获得 10 瓶自己酿造的优秀品质的酒"
    icon: { item: "minecraft:gold_ingot" }
    frame: goal
    trigger: brew_obtain
    filter: { quality: "excellent" }
    goal: 10
    rewards: { exp: 80, coins: 500 }
  excellent_variety:
    parent: ten_excellent
    title: "大师酿造"
    description: "酿出 10 种不同的优秀品质的酒"
    icon: { item: "minecraft:nether_star" }
    frame: challenge
    trigger: brew_obtain
    filter: { quality: "excellent" }
    goal: 10
    count: unique
    unique-by: recipe
    rewards: { exp: 100, coins: 1000 }

  # —— 品饮 ——
  two_hundred_drinks:
    parent: fifty_drinks
    title: "酒中仙"
    description: "喝下 200 瓶酒"
    icon: { item: "minecraft:experience_bottle" }
    frame: challenge
    trigger: brew_drink
    goal: 200
    rewards: { exp: 100, coins: 500 }
  connoisseur:
    parent: fifty_drinks
    title: "品鉴师"
    description: "喝过 15 种不同的酒"
    icon: { item: "minecraft:spyglass" }
    frame: goal
    trigger: brew_drink
    goal: 15
    count: unique
    unique-by: recipe
    rewards: { exp: 60, coins: 400 }
